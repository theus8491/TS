<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lista de scammers Warspear Online — Mcs</title>

  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    .card-bg { background: linear-gradient(180deg,#6b1515,#7b1f1f); }
    .card-panel { background: rgba(0,0,0,0.15); border: 1px solid rgba(255, 255, 255, 0.1); }
    .avatar-frame { width: 160px; height: 160px; border-radius: 12px; overflow:hidden; }

    body {
      min-height: 100vh;
      background: linear-gradient(to bottom, #0b0b0b, #121212);
      color: #e5e7eb; 
    }
  </style>
</head>

<body class="font-sans">

<header class="max-w-5xl mx-auto p-6">
  <div class="flex items-center gap-4">
    <div class="w-12 h-12 rounded-md bg-red-600 flex items-center justify-center text-white font-black text-2xl">
      ⚠️
    </div>
    <div>
      <h1 class="text-3xl font-extrabold text-red-400">Alerta WS: Mural dos Golpistas</h1>
      <p class="text-sm text-gray-300">Golpes, contas roubadas e fraudes — fique atento!</p>
    </div>
  </div>

  <div class="mt-6 card-bg rounded-lg p-6">
    <h2 class="text-xl font-bold text-center text-yellow-300">Proteja sua conta!</h2>
    <p class="text-sm text-gray-200 mt-2 text-center">
      Lista comunitária e informativa.
      <strong class="block text-red-300 mt-1">Nunca divulgue dados pessoais.</strong>
    </p>
  </div>
</header>

<main class="max-w-5xl mx-auto px-6 pb-12">

  <section id="cardsContainer" class="mt-6 grid grid-cols-1 gap-6"></section>

  <footer class="mt-12 text-xs text-gray-500 text-center">
    <strong>Aviso legal:</strong> Site comunitário não oficial do Warspear Online.
  </footer>
</main>

<template id="cardTpl">
  <article class="card-panel rounded-xl p-5 grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
    
    <div class="avatar-frame bg-gray-800 flex items-center justify-center mx-auto md:mx-0">
      <img class="w-full h-full object-cover" />
    </div>
    
    <div class="md:col-span-2">
      <div class="flex flex-col sm:flex-row justify-between">
        <div>
          <h4 class="text-2xl font-extrabold name text-red-300"></h4>
          <div class="text-sm text-gray-400 server"></div>
        </div>
        <div class="text-right mt-2 sm:mt-0">
          <div class="riskBadge text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider"></div>
          <div class="text-xs text-gray-500 mt-1 date"></div>
        </div>
      </div>

      <p class="mt-3 desc text-gray-300 text-sm"></p>

      <div class="mt-4 text-sm text-gray-400 border-t border-gray-700/50 pt-3">
        Crimes: <span class="crimes text-gray-200 italic"></span>
      </div>
    </div>
  </article>
</template>

<script>
const scammers = [
  {
    nick: 'Armajedom',
    server: 'BR-Tourmaline',
    risk: 'alta',
    desc: 'Scammer perigoso, anuncia falsos itens e rouba bag de guild.',
    crimes: 'Roubo, Fraude',
    image: 'arma.png',
    date: '23/10/2025'
  },
  {
    nick: 'Faça sua denúncia',
    server: 'BR-Tourmaline',
    risk: 'media',
    desc: 'Promete item e não entrega.',
    crimes: 'Golpe',
    image: '',
    date: '22/10/2025'
  },
  {
    nick: '(Vaga)',
    server: 'BR-Tourmaline',
    risk: 'baixa',
    desc: 'Suspeita sem roubo confirmado.',
    crimes: 'Suspeita',
    image: 'vendedorgold.png',
    date: '01/10/2025'
  }
];

const riskStars = { alta:5, media:3, baixa:1 };

const container = document.getElementById('cardsContainer');
const tpl = document.getElementById('cardTpl');

function renderCard(obj) {
  const card = tpl.content.cloneNode(true);

  card.querySelector('.name').textContent = obj.nick;
  card.querySelector('.server').textContent = 'Servidor: ' + obj.server;
  card.querySelector('.desc').textContent = obj.desc;
  card.querySelector('.crimes').textContent = obj.crimes;
  card.querySelector('.date').textContent = '📅 ' + obj.date;

  const img = card.querySelector('img');
  img.src = obj.image || 'https://via.placeholder.com/160x160?text=SEM+PRINT';

  const stars =
    '★'.repeat(riskStars[obj.risk]) +
    '☆'.repeat(5 - riskStars[obj.risk]);

  const badge = card.querySelector('.riskBadge');

  if (obj.risk === 'alta') {
    badge.innerHTML = `ALTA PERICULOSIDADE <span class="ml-2 text-yellow-400">${stars}</span>`;
    badge.classList.add('bg-red-700','text-white','shadow-md','shadow-red-900/50');
  } else if (obj.risk === 'media') {
    badge.innerHTML = `PERIGOSO <span class="ml-2 text-yellow-400">${stars}</span>`;
    badge.classList.add('bg-yellow-500','text-gray-900');
  } else {
    badge.innerHTML = `BAIXA <span class="ml-2 text-yellow-400">${stars}</span>`;
    badge.classList.add('bg-gray-600','text-white');
  }

  return card;
}

scammers.forEach(s => container.appendChild(renderCard(s)));
</script>

</body>
</html>
